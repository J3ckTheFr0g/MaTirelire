/* ---------- Événements ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if(a === 'edit-line' && e.target.closest('.sw')) return;
  switch(a){
    case 'tab': if(t.dataset.tab === 'synthese' && U.tab !== 'synthese'){ if(reducedMotion()) U.bubbleIdx = (U.bubbleIdx || 0) + 1; U.bubbleChanged = Date.now(); } U.tab = t.dataset.tab; render(); window.scrollTo(0,0); break;
    case 'add-idea': {
      const idea = IDEAS.find(x => x.id === id); if(!idea) break;
      openLine(null, ideaCat(idea), {name:idea.name, amount:idea.amount, cycle:{...idea.cycle}, method:idea.method, kind:'debit', note: idea.life ? `Durée de vie estimée : ${idea.life}.` : ''});
      break; }
    case 'ideas-all': U.ideasAll = !U.ideasAll; render(); break;
    case 'cat-open': U.openCat = (U.openCat === id) ? null : id; render(); break;
    case 'help-transfer': openTransferHelp(); break;
    case 'paid': {
      const l = S.lines.find(x => x.id === id); if(!l) break;
      const p = provInfo(l, undefined, provisionClock(S));
      if(p.over >= 1 && !confirm(`« ${l.name} » a un dépassement d’objectif de ${money(p.over)}. En marquant la ligne comme payée, ce dépassement ne sera plus suivi : pense à le reprendre en épargne si besoin. Continuer ?`)) break;
      l.lastDate = isoToday(); touch(); toast('Marqué comme payé : le suivi repart de zéro'); break; }
    case 'today': U.month = new Date().getMonth() + 1; render(); break;
    case 'advice': goAdvice(t.dataset.kind); break;
    case 'bubble': {
      const m = bubbleCurrent(); if(!m) break;
      if(m.type === 'advice' && m.go) goAdvice(m.kind);
      else { U.bubbleIdx = (U.bubbleIdx || 0) + 1; U.bubbleHold = Date.now() + 10000; swapBubble(); }
      break; }
    case 'month': U.month = +t.dataset.m; render(); break;
    case 'mode': S.settings.distribution.mode = t.dataset.mode; touch(); break;
    case 'todo': U.todo = !U.todo; t.setAttribute('aria-pressed', U.todo); $('#list').innerHTML = listHTML(); break;
    case 'toggle-cat': U.collapsed[id] = !U.collapsed[id]; $('#list').innerHTML = listHTML(); break;
    case 'add-line': openLine(null, t.dataset.cat); break;
    case 'edit-line': openLine(id); break;
    case 'save-line': saveLine(); break;
    case 'dup-line': {
      const l = readLineForm(); if(!l.name) break;
      const c = {...l, id:uid(), name:l.name + ' (copie)', auto:null, forMember:null};
      S.lines.push(c); $('#dlg').close(); touch(); toast('Ligne dupliquée'); break; }
    case 'del-line':
      if(confirm('Supprimer cette ligne ?')){ S.lines = S.lines.filter(l => l.id !== U.editing.id); $('#dlg').close(); touch(); toast('Ligne supprimée'); } break;
    case 'close-dlg': $('#dlg').close(); break;
    case 'setup': openSetup(); break;
    case 'create-home': createHome(); break;
    case 'open': openFile(); break;
    case 'save': saveFile(false); break;
    case 'save-as': saveFile(true); break;
    case 'export': download('matirelire.json', JSON.stringify(S, null, 2)); U.lastSaved = new Date(); updateStatus(); toast('Copie téléchargée'); break;
    case 'reconnect': reconnect(); break;
    case 'dismiss': U.notice = null; render(); break;
    case 'add-member': {
      const type = t.dataset.type, n = S.members.filter(m => m.type === type).length + 1;
      const m = {id:uid(), name: type === 'adult' ? `Adulte ${n}` : `Enfant ${n}`, type, contributes:type === 'adult', pocket:{amount:0, payer:'split'}, transferDay:1, transferNext:false};
      S.members.push(m);
      if(type === 'adult') S.accounts.push({id:uid(), name:`Compte de ${m.name}`, bank:'', ownerId:m.id});
      syncAllPockets(S); touch(); break; }
    case 'del-member': {
      const m = S.members.find(x => x.id === id);
      if(!confirm(`Retirer ${m.name} ? Ses lignes personnelles (revenus et dépenses) seront supprimées.`)) break;
      S.lines = S.lines.filter(l => l.ownerId !== id && l.forMember !== id);
      S.members = S.members.filter(x => x.id !== id);
      S.accounts.forEach(a => { if(a.ownerId === id) a.ownerId = null; });
      delete S.settings.distribution.custom[id]; syncAllPockets(S); touch(); break; }
    case 'add-acc': S.accounts.push({id:uid(), name:'Nouveau compte', bank:'', ownerId:null}); touch(); break;
    case 'del-acc':
      if(!confirm('Supprimer ce compte ? Les lignes qui l’utilisent n’auront plus de compte cible.')) break;
      S.lines.forEach(l => { if(l.accountId === id) l.accountId = null; });
      if(S.settings.commonAccountId === id) S.settings.commonAccountId = null;
      S.accounts = S.accounts.filter(a => a.id !== id); touch(); break;
    case 'add-cat': S.categories.push({id:uid(), name:'Nouvelle catégorie', color:CAT_COLORS[S.categories.length % CAT_COLORS.length]}); touch(); break;
    case 'del-cat': {
      const used = S.lines.filter(l => l.catId === id).length;
      if(!confirm(used ? `Supprimer cette catégorie ? Ses ${used} ligne(s) passeront dans « Divers ».` : 'Supprimer cette catégorie ?')) break;
      S.categories = S.categories.filter(c => c.id !== id);
      if(used){ const d = ensureCategory(S, 'Divers'); S.lines.forEach(l => { if(l.catId === id) l.catId = d.id; }); }
      touch(); break; }
    case 'cat-up': case 'cat-down': {
      const i = S.categories.findIndex(c => c.id === id), j = a === 'cat-up' ? i - 1 : i + 1;
      if(j >= 0 && j < S.categories.length){ [S.categories[i], S.categories[j]] = [S.categories[j], S.categories[i]]; touch(); } break; }
    case 'add-method': S.settings.methods.push({id:'m_' + uid(), label:'Nouveau moyen'}); touch(); break;
    case 'del-method':
      S.lines.forEach(l => { if(l.method === id) l.method = null; });
      S.settings.methods = S.settings.methods.filter(m => m.id !== id); touch(); break;
    case 'reset-template':
      if(!confirm('Remplacer toutes les données par un modèle vierge ? Cette action est immédiate (penser à exporter avant).')) break;
      S = null; U.notice = null; render(); openSetup(); break;
    case 'forget':
      if(!confirm('Fermer ce foyer et effacer la copie de secours de ce navigateur ? Le fichier JSON sur l’appareil n’est pas touché.')) break;
      localStorage.removeItem(LS_KEY); await idbDel('handle'); S = null; U.fileHandle = null; U.fileName = null; U.pending = null; U.dirty = false; render(); break;
  }
});
document.addEventListener('keydown', e => {

document.addEventListener('input', e => {

document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'file-in'){ if(el.files[0]) loadFromInput(el.files[0]); el.value = ''; return; }
  if(el.closest('#dlg')){ onDialogChange(el); return; }
  if(el.id === 'flt-owner'){ U.owner = el.value; $('#list').innerHTML = listHTML(); return; }
  if(el.id === 'flt-kind'){ U.kind = el.value; $('#list').innerHTML = listHTML(); return; }

});
function onDialogChange(el){
  if(el.id === 'f-owner'){
    const acc = $('#f-account'), cur = accById(acc.value), oid = el.value;
    if(!cur || (oid === 'common' ? cur.ownerId : cur.ownerId !== oid)) acc.value = defaultAccountFor(S, oid) || '';
  }
  if(el.id === 'f-cat' && el.value === '__new'){
    const name = (prompt('Nom de la nouvelle catégorie :') || '').trim();
    if(name){
      const c = ensureCategory(S, name), o = document.createElement('option');
      o.value = c.id; o.textContent = c.name; el.insertBefore(o, el.querySelector('option[value="__new"]')); el.value = c.id; backupNow();
    } else el.value = (S.categories[0]||{}).id;
  }
  if($('#f-preview')) refreshLineForm();
}
function onBind(el, b){
  const [k, id, f] = b.split(':');
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if(k === 'line'){ const l = S.lines.find(x => x.id === id); if(l){ l.active = v; touch(); } }
  else if(k === 'member'){
    const m = S.members.find(x => x.id === id); if(!m) return;
    if(f === 'name'){ const old = m.name; m.name = String(v).trim() || 'Sans nom'; const sl = salaryLine(S, id); if(sl && sl.name === `Salaire net – ${old}`) sl.name = `Salaire net – ${m.name}`; syncAllPockets(S); touch(false); }
    else if(f === 'type'){ m.type = v; m.contributes = v === 'adult'; syncAllPockets(S); touch(); }
    else if(f === 'contributes'){ m.contributes = v; syncAllPockets(S); touch(); }
    else if(f === 'transferDay'){ m.transferDay = Math.min(Math.max(parseInt(v) || 1, 1), 31); touch(false); }
    else if(f === 'transferNext'){ m.transferNext = v === 'next'; touch(false); }
    else if(f === 'salary'){ setSalary(S, id, num(v)); touch(false); }
    else if(f === 'pocketAmount'){ m.pocket.amount = Math.abs(num(v)); syncPocket(S, id); touch(false); }
    else if(f === 'pocketPayer'){ m.pocket.payer = v; syncPocket(S, id); touch(false); }
  }
  else if(k === 'dist'){
    const d = S.settings.distribution;
    if(f === 'mode') d.mode = v; else if(f === 'includePersonal') d.includePersonal = v;
    touch();
  }
  else if(k === 'distc'){ S.settings.distribution.custom[id] = Math.max(0, num(v)); touch(false); }
  else if(k === 'set'){ if(f === 'backup' && !v){ try{ localStorage.removeItem(LS_KEY); }catch{} } S.settings[f] = f === 'commonAccountId' ? (v || null) : v; touch(f === 'currency' || f === 'commonAccountId' || f === 'provisionBlock' ? true : false); }
  else if(k === 'acc'){
    const a = accById(id); if(!a) return;
    a[f] = f === 'ownerId' ? (v || null) : String(v).trim(); touch(f === 'ownerId');
  }
  else if(k === 'cat'){ const c = S.categories.find(x => x.id === id); if(c){ c[f] = f === 'name' ? (String(v).trim() || 'Sans nom') : v; touch(false); } }
  else if(k === 'method'){ const m = S.settings.methods.find(x => x.id === id); if(m){ m.label = String(v).trim() || 'Sans nom'; touch(false); } }
  else if(k === 'prov'){
    const l = S.lines.find(x => x.id === id); if(!l) return;
    if(f === 'lastDate') l.lastDate = v || null;
    touch(false); patchProv(id);
  }
}
/* Bulle : pause au survol (souris), au focus et après un appui tactile */
(function(){
  const canHover = !!(window.matchMedia && matchMedia('(hover: hover)').matches);
  const inBox = e => e.target.closest && e.target.closest('.hero-pig');
  if(canHover){
    document.addEventListener('mouseover', e => { if(inBox(e)) U.bubbleHover = true; });
    document.addEventListener('mouseout', e => { if(inBox(e) && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.hero-pig'))) U.bubbleHover = false; });
  }
  document.addEventListener('focusin', e => { if(inBox(e)) U.bubbleFocus = true; });
  document.addEventListener('focusout', e => { if(inBox(e)) U.bubbleFocus = false; });
  document.addEventListener('pointerdown', e => { if(e.pointerType === 'touch' && inBox(e)) U.bubbleHold = Date.now() + 10000; });
  setInterval(bubbleTick, 3000);
})();
document.addEventListener('DOMContentLoaded', () => {
  const dlg = $('#dlg');
  dlg.addEventListener('click', e => { if(e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => {
    if(!U.tempCat) return;
    const id = U.tempCat; U.tempCat = null;
    if(S && !S.lines.some(l => l.catId === id)) S.categories = S.categories.filter(c => c.id !== id);
  });
  init();
});
window.addEventListener('beforeunload', e => { if(S && U.dirty && !U.fileHandle && !S.settings.backup){ e.preventDefault(); e.returnValue = ''; } });

</script>
