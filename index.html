    return;
  }
  const r = payFinal(S, l.id, amount, date, note, provisionClock(S)); $('#dlg').close(); touch();
  const extra = r && Math.abs(r.delta) >= 0.005 ? ` · ${r.delta > 0 ? 'reliquat' : 'manque'} ${money(Math.abs(r.delta))} ${r.delta > 0 ? 'ajouté à' : 'dans'} la cagnotte` : '';
  toastUndo(`${l.name} soldé${extra}`, () => { l.paid = snap.paid; l.lastDate = snap.lastDate; S.pot = S.pot.slice(0, snap.potLen); touch(); });
}
/* Cagnotte */
function potEntryRow(x){
  return `<li><button type="button" class="spend-row" data-act="pot-edit" data-id="${esc(x.id)}" aria-label="Modifier cette ligne de la cagnotte"><span>${fmtShort(x.date)} <small>${POT_LABEL[x.kind] || ''}${x.label ? ' · ' + esc(x.label) : ''}${x.dest ? ' → ' + esc(accLabel(x.dest)) : ''}</small></span><i class="dots"></i><b class="${x.amount < 0 ? 'debit' : 'credit'}">${potSigned(x.amount)}</b></button></li>`;
}
function openPot(){
  const tot = potTotal(S), dlg = $('#dlg'); U.editing = null;
  const list = (S.pot || []).slice().sort((a, b) => b.date.localeCompare(a.date) || 0);
  dlg.innerHTML = dlgShell(`Cagnotte ${H('pot')}`, `<div class="rest"><b class="${tot < -0.005 ? 'neg' : ''}">${tot < -0.005 ? '−' : ''}${money(Math.abs(tot))}</b><span>${tot < -0.005 ? 'manque dans les provisions' : 'écart disponible dans les provisions'}</span></div>
    ${list.length ? `<ul class="leaders spendlist">${list.map(potEntryRow).join('')}</ul>` : '<p class="hint">La cagnotte est vide. Elle reçoit les reliquats quand tu paies moins que prévu, et le manque quand tu paies plus.</p>'}`,
    `<div class="potacts"><button type="button" class="btn" data-act="pot-save" ${tot > 0.005 ? '' : 'disabled'}>Épargner</button><button type="button" class="btn" data-act="pot-adjust">Ajuster</button><button type="button" class="btn" data-act="pot-fix">Fixer à…</button></div><div class="r"><button type="button" class="btn primary" data-act="close-dlg">Fermer</button></div>`);
  dlg.showModal();
}
function openPotForm(kind, entryId){
  const tot = potTotal(S), dlg = $('#dlg'), e = entryId ? S.pot.find(x => x.id === entryId) : null; U.editing = null; U.potCtx = {kind, entryId:entryId || null};
  const acc = S.accounts.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
  let title, body, ok = 'Valider';
  if(kind === 'save'){
    title = 'Mettre de côté en épargne'; ok = 'Épargner';
    body = `<p class="hint">Retire un montant de la cagnotte, donc des provisions et de l’état du compte. Il reste un virement à faire vers ton épargne.</p>
      <label class="field">Montant à épargner (cagnotte : ${money(tot)})<input class="inp bigamt" id="pf-amount" type="number" step="0.01" min="0" inputmode="decimal" value="${tot > 0.005 ? Math.round(tot * 100) / 100 : ''}" enterkeyhint="done"></label>
      <div class="grid2"><label class="field">Destination<select class="inp" id="pf-dest"><option value="">— à préciser —</option>${acc}</select></label><label class="field">Date<input class="inp" id="pf-date" type="date" value="${isoToday()}"></label></div>
      <label class="field">Note (facultatif)<input class="inp" id="pf-note" placeholder="Ex. Livret A" autocomplete="off" enterkeyhint="done"></label>`;
  } else if(kind === 'adjust'){
    title = 'Ajuster la cagnotte';
    body = `<div class="field">Opération<div class="seg" role="radiogroup" aria-label="Opération"><label><input type="radio" name="pf-sign" value="1" checked>Ajouter</label><label><input type="radio" name="pf-sign" value="-1">Retirer</label></div></div>
      <label class="field">Montant<input class="inp bigamt" id="pf-amount" type="number" step="0.01" min="0" inputmode="decimal" enterkeyhint="done"></label>
      <div class="grid2"><label class="field">Motif<input class="inp" id="pf-label" placeholder="Ex. cadeau reçu" autocomplete="off" enterkeyhint="done"></label><label class="field">Date<input class="inp" id="pf-date" type="date" value="${isoToday()}"></label></div>`;
  } else if(kind === 'fix'){
    title = 'Fixer la cagnotte à…';
    body = `<p class="hint">Saisis le total voulu : l’écart est enregistré comme un ajustement.</p>
      <label class="field">Cagnotte souhaitée (actuellement ${potSigned(tot)})<input class="inp bigamt" id="pf-amount" type="number" step="0.01" inputmode="decimal" value="${Math.round(tot * 100) / 100}" enterkeyhint="done"></label>
      <input type="hidden" id="pf-date" value="${isoToday()}">`;
  } else {
    title = 'Modifier la ligne';
    body = `<label class="field">Montant (négatif = sortie)<input class="inp bigamt" id="pf-amount" type="number" step="0.01" inputmode="decimal" value="${e.amount}" enterkeyhint="done"></label>
      <div class="grid2"><label class="field">Libellé<input class="inp" id="pf-label" value="${esc(e.label)}" autocomplete="off" enterkeyhint="done"></label><label class="field">Date<input class="inp" id="pf-date" type="date" value="${esc(e.date)}"></label></div>
      <label class="field">Note<input class="inp" id="pf-note" value="${esc(e.note)}" autocomplete="off" enterkeyhint="done"></label>`;
  }
  dlg.innerHTML = dlgShell(title, body, `${kind === 'edit' ? '<button type="button" class="btn danger" data-act="pot-del">Supprimer</button>' : '<span></span>'}<div class="r"><button type="button" class="btn" data-act="pot-back">Retour</button><button type="button" class="btn primary" data-act="pot-confirm">${ok}</button></div>`);
  if(!dlg.open) dlg.showModal();
  if(kind === 'edit' && e && e.dest){ const sel = $('#pf-dest'); if(sel) sel.value = e.dest; }
  focusQuiet($('#pf-amount'));
}
function confirmPot(){
  const c = U.potCtx; if(!c) return;
  const date = $('#pf-date').value, amtRaw = num($('#pf-amount').value), amtAbs = Math.abs(amtRaw), tot = potTotal(S);
  if(!parseISO(date)){ toast('Choisis la date.'); return; }
  const snap = JSON.parse(JSON.stringify(S.pot || []));
  const undo = msg => toastUndo(msg, () => { S.pot = snap; touch(); });
  if(c.kind === 'save'){
    if(!(amtAbs > 0)){ toast('Saisis le montant à épargner.'); return; }
    if(amtAbs > tot + 0.005){ toast(`La cagnotte ne contient que ${money(Math.max(0, tot))}.`); return; }
    const dest = $('#pf-dest').value || null, note = $('#pf-note').value.trim();
    potAdd(S, 'epargne', -amtAbs, date, 'Mise de côté', {dest, note}); $('#dlg').close(); touch();
    undo(`${money(amtAbs)} mis de côté${dest ? ` : à virer vers ${accLabel(dest)}` : ''}`); return;
  }
  if(c.kind === 'adjust'){
    if(!(amtAbs > 0)){ toast('Saisis le montant.'); return; }
    const sign = +$('input[name=pf-sign]:checked').value;
    potAdd(S, 'ajustement', sign * amtAbs, date, $('#pf-label').value.trim() || 'Ajustement manuel'); $('#dlg').close(); touch(); undo(`Cagnotte ${sign > 0 ? '+' : '−'}${money(amtAbs)}`); return;
  }
  if(c.kind === 'fix'){
    const delta = amtRaw - tot;
    if(Math.abs(delta) < 0.005){ $('#dlg').close(); toast('La cagnotte est déjà à ce montant.'); return; }
    potAdd(S, 'ajustement', delta, date, `Cagnotte fixée à ${money(amtRaw)}`); $('#dlg').close(); touch(); undo(`Cagnotte fixée à ${money(amtRaw)}`); return;
  }
  const e = S.pot.find(x => x.id === c.entryId); if(!e) return;
  if(Math.abs(amtRaw) < 0.005){ toast('Le montant ne peut pas être nul : supprime la ligne si besoin.'); return; }
  e.amount = amtRaw; e.date = date; e.label = $('#pf-label').value.trim(); e.note = $('#pf-note').value.trim(); $('#dlg').close(); touch(); undo('Ligne de la cagnotte modifiée');
}
/* Recalage sur le solde réel */
function openRecalage(){
  const P = provisionSummary(S), st = P.cash.state, acc = S.accounts.find(a => a.id === S.settings.commonAccountId), dlg = $('#dlg'); U.editing = null; U.recState = st;
  dlg.innerHTML = dlgShell(`Recaler${acc ? ' · ' + esc(acc.name) : ''}`, `<p class="hint">Saisis le solde réel du compte tel que tu le vois dans ta banque : l’écart avec l’état attendu va dans la cagnotte (en plus si tu as davantage, en négatif si tu as moins).</p>
    <p class="envmini">État attendu aujourd’hui : <b>${money(st)}</b></p>
    <label class="field">Solde réel aujourd’hui<input class="inp bigamt" id="rc-real" type="number" step="0.01" inputmode="decimal" placeholder="0,00" enterkeyhint="done"></label>
    <input type="hidden" id="rc-date" value="${isoToday()}"><div class="preview" id="rc-info" aria-live="polite">Saisis ton solde réel pour voir l’écart.</div>`,
    `<span></span><div class="r"><button type="button" class="btn" data-act="close-dlg">Annuler</button><button type="button" class="btn primary" data-act="rc-save">Recaler</button></div>`);
  dlg.showModal(); focusQuiet($('#rc-real'));
}
function recalageInfo(){
  const v = $('#rc-real').value; if(String(v).trim() === '') return 'Saisis ton solde réel pour voir l’écart.';
  const d = num(v) - U.recState;
  return Math.abs(d) < 0.005 ? 'Ton solde correspond déjà à l’état attendu.' : (d > 0 ? `Écart : <b class="credit">+${money(d)}</b> → ajouté à la cagnotte.` : `Écart : <b class="debit">−${money(-d)}</b> → la cagnotte baisse (manque).`);
}
function saveRecalage(){
  const v = $('#rc-real').value; if(String(v).trim() === ''){ toast('Saisis ton solde réel.'); focusQuiet($('#rc-real')); return; }
  const snap = JSON.parse(JSON.stringify(S.pot || [])), r = recalage(S, num(v), $('#rc-date').value);
  $('#dlg').close(); touch();
  if(!r.entry){ toast('Ton solde correspond déjà à l’état attendu.'); return; }
  toastUndo(`Recalé : ${potSigned(r.delta)} dans la cagnotte`, () => { S.pot = snap; touch(); });
}

/* ----- Aide intégrée : un « ? » à côté du titre de chaque bloc ----- */
const HELP = {
  transfer:{title:'Ce versement compte pour…', body:`<p>Tu choisis le <b>jour</b> où ton salaire arrive (de 1 à 31 ; 31 veut dire « dernier jour du mois »), puis le <b>mois que ce versement finance</b>.</p>
    <p><b>Le mois en cours</b> (par défaut) : le salaire reçu le 5 octobre finance le budget d’octobre.</p>
    <p><b>Le mois suivant</b> : le salaire reçu le 28 octobre (ou le 30, le 31, le 15… n’importe quel jour) finance le budget de <b>novembre</b>. C’est le cas quand ton salaire arrive en fin de mois pour payer le mois d’après.</p>
    <p><b>Ce que ça change</b></p>
    <ul><li><b>Budget</b> (Synthèse, reste à vivre) : le salaire saisi compte toujours dans le mois qu’il finance, quel que soit son jour d’arrivée.</li><li><b>Compte provisions</b> : la mensualité est comptée sur le compte dès que le versement arrive (le 28 octobre dans l’exemple), mais attribuée à novembre.</li><li><b>Prochain virement</b> et <b>trajectoire</b> : les dates tiennent compte de ce décalage.</li><li><b>Plusieurs contributeurs</b> : une mensualité est comptée quand tous les versements sont arrivés.</li></ul>
    <p class="note">Ce jour est aussi celui du virement vers le compte de provision. Si ton salaire et ton virement n’arrivent pas le même jour, saisis le jour du virement.</p>`},
  'wiz-membres':{title:'Les membres du foyer', body:`<p>Chaque personne du foyer : <b>adulte</b>, <b>adolescent</b> ou <b>enfant</b>.</p><p>Un adulte a un salaire et peut <b>participer au budget commun</b> : c’est lui qui alimente le compte de provision. Un enfant ou un adolescent peut recevoir de l’argent de poche.</p><p class="note">Il faut au moins un adulte. Les prénoms servent partout : virements, reste à vivre, répartition.</p>`},
  'wiz-comptes':{title:'Les comptes du foyer', body:`<p>Déclare les comptes bancaires que vous utilisez : un compte joint, un compte par personne, un livret pour l’argent de poche…</p><p>Le <b>compte de provision</b> reçoit les virements de chacun pour le budget commun et règle les dépenses. Les lignes du budget sont ensuite rattachées à ces comptes, ce qui alimente les virements à programmer.</p><p class="note">Un compte par adulte est proposé. Tu peux tout renommer, ajouter ou retirer.</p>`},
  env:{title:'Enveloppes', body:`<p>Une enveloppe est une <b>somme prévue pour le mois</b> pour une dépense qui varie : courses, essence, pain, vêtements…</p>
    <p>Au fil des achats, tu appuies sur <b>+</b> et tu déclares le montant. La barre montre ce qui est dépensé, ce qu’il reste et le montant par jour restant.</p>
    <p>Si tu dépasses, le <b>dépassement</b> s’affiche à part : il ne change pas ton reste à vivre prévu, mais il baisse l’état du compte provisions.</p><p class="note">Appuie sur une enveloppe pour voir, modifier ou supprimer ses dépenses.</p>`},
  'env-guide':{title:'Suivre mes dépenses variables', body:`<p>MaTirelire repère les lignes qui ressemblent à des dépenses variables : payées par carte ou en espèces sans jour fixe, ou nommées courses, carburant, pain, vêtements, restaurants…</p><p>Coche celles à suivre : elles deviennent des enveloppes, avec le même montant prévu. Tu pourras toujours les modifier dans Budget.</p>`},
  'kid-espace':{title:'Espace enfants', body:`<p>Un espace plein écran, <b>pensé pour l’enfant</b> : une tirelire à trois bocaux (dépenser, épargner, donner), des <b>rêves</b> à réaliser, des succès et des niveaux.</p>
    <ul><li>L’argent de poche arrive tout seul au jour prévu, selon le montant du budget.</li><li>Un <b>code parent</b> à quatre chiffres protège les réglages, la validation des achats et la sortie de l’espace.</li><li>Tout reste dans ton fichier : pas de compte, pas de publicité, pas d’achat.</li></ul><p class="note">Le vocabulaire s’adapte à l’âge : petits, juniors, ados.</p>`},
  'kid-mascotte':{title:'Ta mascotte', body:`<p>Elle te souhaite la bienvenue, te félicite quand tu avances et t’encourage quand tu dois attendre. Chaque enfant choisit la sienne, et elle peut changer à tout moment dans « Moi ».</p>`},
  'kid-code':{title:'Le code parent', body:`<p>Un code à quatre chiffres que seuls les parents connaissent. Il sert à valider l’achat d’un rêve, à régler l’argent de poche et à supprimer l’espace.</p><p>Sans code, rien n’est bloqué : l’appli te demande seulement si un parent est d’accord. Tu peux en créer un plus tard dans l’espace parent.</p>`},
  source:{title:'Source du fichier', body:`<p>Quand tu ouvres un fichier (iCloud Drive, Google Drive, Dropbox…), l’appli <b>retient son nom et son emplacement</b> sur cet appareil et s’appuie dessus. La copie du navigateur n’est plus qu’un filet de sécurité silencieux.</p><ul><li><b>À enregistrer</b> : des changements ne sont pas encore dans ton fichier.</li><li><b>Enregistrer dans Fichiers</b> ouvre la feuille de partage d’iOS avec le même nom : choisis le même endroit et remplace le fichier.</li><li><b>Recharger depuis le fichier</b> compare les dates : tu sais lequel est le plus récent, rien n’est écrasé sans ton accord.</li></ul><p class="note">Sur iPhone, une page web ne peut pas écrire seule dans le cloud : c’est une limite d’iOS.</p>`},
  espaces:{title:'Plusieurs espaces', body:`<p>Sur un même appareil, tu peux garder <b>plusieurs espaces</b> : le foyer des parents, et l’espace de chaque enfant. Chacun a son propre fichier JSON et sa propre copie de secours.</p><ul><li><b>Changer d’espace</b> ne supprime rien : tu retrouves tout dans la liste de l’accueil.</li><li><b>Supprimer</b> retire un espace de l’appareil. Les fichiers que tu as enregistrés ne sont pas touchés.</li></ul><p class="note">Un parent peut importer l’espace d’un enfant dans son foyer, et inversement.</p>`},
  verrou:{title:'Accès à ce foyer', body:`<p>Quand un enfant utilise le même appareil, active le <b>code parent à l’ouverture</b> : pour ouvrir ce foyer depuis la liste des espaces, le code est demandé. L’appli ne rouvre alors pas le foyer toute seule au démarrage.</p><p class="note">C’est un garde-fou familial, pas un coffre-fort : le fichier JSON reste lisible par qui y a accès.</p>`},
  'kid-fichier':{title:'Mon fichier', body:`<p>Ta tirelire est rangée dans un fichier, sur cet appareil. Rien n’est envoyé sur Internet.</p><ul><li><b>Enregistrer</b> met le fichier à jour (selon ton appareil, il est téléchargé).</li><li><b>Exporter</b> crée une copie que tu peux garder ou donner à un parent.</li></ul><p class="note">Un parent peut importer ce fichier dans son foyer pour suivre ta tirelire avec toi.</p>`},
  'kid-budget':{title:'Mon budget', body:`<p>Un budget, c’est un plan pour le mois : <b>combien tu peux dépenser</b> dans chaque catégorie.</p><ul><li>Fixe un plafond par enveloppe (sorties, jeux…). La barre se remplit à mesure que tu notes tes dépenses.</li><li>Les <b>abonnements</b> sont prélevés tout seuls, chaque mois, dans ton bocal « dépenser ». S’il n’y a pas assez d’argent, rien n’est prélevé et on te le dit, sans punition.</li><li>Tout cela te prépare à ton premier vrai budget d’adulte.</li></ul>`},
  'kid-simu':{title:'Simulateurs', body:`<p>Pour <b>s’entraîner</b> : change les chiffres et regarde ce qui se passe.</p><ul><li><b>Épargne</b> : ce que tu auras après quelques mois ou années, avec ou sans intérêts.</li><li><b>Abonnement</b> : ce qu’il coûte par an et sur plusieurs années.</li><li><b>Par usage</b> : le vrai prix d’un achat selon le nombre de fois où tu t’en sers.</li></ul><p class="note">Ce sont des estimations : les vrais taux et prix changent.</p>`},
  'kid-lecons':{title:'Leçons', body:`<p>Chaque leçon tient en <b>trois cartes</b> à lire, puis un <b>petit quiz</b> de deux questions.</p><ul><li>Une leçon est réussie quand tu as au moins la moitié des bonnes réponses. Tu peux recommencer : ton meilleur score est gardé.</li><li>Les leçons gagnées te donnent des succès, et débloquent des accessoires pour ta mascotte.</li><li>Elles sont adaptées à ton âge : les petits, les juniors et les ados n’ont pas les mêmes.</li></ul>`},
  'kid-acc':{title:'Accessoires de ta mascotte', body:`<p>Chaque succès peut débloquer un accessoire : chapeau de fête, couronne, lunettes, écharpe…</p><ul><li>Appuie sur un accessoire débloqué pour le mettre, rappuie pour l’enlever.</li><li>Tu peux en porter <b>un par emplacement</b> : sur la tête, sur le visage, autour du cou.</li><li>Un accessoire verrouillé t’indique le succès qu’il faut gagner.</li></ul>`},
  'kid-envies':{title:'Envies à mûrir', body:`<p>Une envie soudaine ? <b>Note-la</b> au lieu d’acheter tout de suite. On attend un peu (24 h, parfois 48 h), puis tu te demandes : « Est-ce que je la veux toujours ? »</p><ul><li><b>Oui</b> : elle devient un rêve et tu peux l’épargner.</li><li><b>Plus envie</b> : bravo, tu as gardé ton argent pour mieux choisir.</li></ul><p class="note">Les grands achats plaisir gagnent à mûrir : c’est une astuce de grands épargnants.</p>`},
  'kid-defis':{title:'Défis', body:`<p>Un défi est un petit challenge de quelques jours. Il <b>se mesure tout seul</b> à partir de ce que tu notes dans l’appli.</p><ul><li>Un seul défi à la fois.</li><li>Si tu ne le réussis pas, ce n’est pas grave : on peut réessayer quand on veut.</li><li>Un parent peut convenir d’une petite récompense pour les défis réussis.</li></ul>`},
  'kid-boost':{title:'Boost et intérêts', body:`<p>Si un parent l’a prévu, il peut <b>compléter</b> les sommes que tu mets dans tes rêves, et ton épargne peut <b>rapporter des intérêts</b> chaque mois : c’est la graine qui pousse.</p><p class="note">Plus tu épargnes tôt, plus tu gagnes. Ce n’est pas de la magie : c’est un coup de pouce de tes parents.</p>`},
  'kid-bilan':{title:'Bilan du mois', body:`<p>Un résumé du mois de l’enfant : ce qui est arrivé, ce qu’il a dépensé, épargné ou donné, ses rêves, ses défis et sa patience.</p><p>Les <b>pistes de discussion</b> sont des idées de questions à lui poser, pas des jugements. Le bilan peut être copié pour être gardé.</p>`},
  'kid-tirelire':{title:'Ma tirelire', body:`<p>Ton argent est rangé dans trois bocaux :</p><ul><li><b>Dépenser</b> : pour tes envies du moment.</li><li><b>Épargner</b> : pour tes rêves. Plus il grossit, plus tu avances.</li><li><b>Donner</b> : pour faire plaisir à quelqu’un ou aider.</li></ul><p class="note">Tu peux recompter tes pièces quand tu veux avec « Compter mes pièces ».</p>`},
  'kid-reves':{title:'Mes rêves', body:`<p>Un rêve, c’est quelque chose qui te ferait vraiment plaisir : un jeu, une sortie, des baskets…</p><p>Tu y mets de l’argent de ton épargne libre. La barre se remplit, et on t’indique à peu près quand tu y arriveras. Quand il est complet, un parent valide l’achat.</p>`},
  'kid-succes':{title:'Succès et niveaux', body:`<p>Chaque fois que tu épargnes, tu avances : <b>Graine</b>, <b>Pousse</b>, <b>Arbuste</b>, <b>Arbre</b>, <b>Forêt</b>.</p><p>Les succès se gagnent en épargnant, en réalisant tes rêves, en donnant ou en comptant tes pièces. Rien ne se perd si tu fais une pause.</p>`},
  pot:{title:'Cagnotte', body:`<p>La cagnotte est l’<b>écart</b> entre l’argent réellement mis de côté pour une dépense et ce que tu as payé.</p>
    <ul><li>Tu paies <b>moins</b> que prévu : le reliquat va dans la cagnotte.</li><li>Tu paies <b>plus</b> : la cagnotte baisse, et si elle passe sous zéro elle indique un <b>manque</b>.</li><li>Tu peux <b>épargner</b> la cagnotte (elle sort des provisions, donc du compte joint), l’<b>ajuster</b> à la main, ou la <b>recaler</b> sur ton solde bancaire réel.</li></ul>
    <p class="note">Elle fait partie de l’état du compte provisions. Chaque ligne de l’historique se modifie ou se supprime.</p>`},
  rav:{title:'Reste à vivre du foyer', body:`<p>C’est ce qu’il reste au foyer une fois le budget commun et les dépenses personnelles payés : <b>revenus − dépenses</b>.</p>
    <p>Il suit le mois choisi dans la barre des mois. « Moyenne » lisse sur l’année les dépenses qui ne tombent pas tous les mois.</p>
    <p class="note">Exemple : 6 000 € de revenus − 4 200 € de budget commun − 170 € de dépenses personnelles = 1 630 € à vivre.</p>`},
  'prov-block':{title:'Compte provisions', body:`<p>Ce bloc répond à deux questions : <b>combien y a-t-il sur le compte aujourd’hui</b>, et <b>combien restera-t-il de provisions une fois les prélèvements du mois passés</b> (l’objectif).</p>
    <ul><li><b>Provisions</b> : l’argent mis de côté pour les dépenses qui ne tombent pas tous les mois (pneus, assurance annuelle…).</li><li><b>Trésorerie du mois</b> : l’argent des virements qui n’est pas encore prélevé (prêt, EDF…).</li></ul>
    <p>État du compte = provisions + trésorerie. Ce n’est pas un solde bancaire : c’est ce que ton budget prévoit.</p>
    <p class="note">Calcul : pour chaque ligne, mensualité × mensualités reçues depuis son dernier paiement, arrondie à l’euro inférieur, comme dans ton Excel. La somme n’est jamais plafonnée : au-delà du coût, c’est un dépassement d’objectif, jusqu’à « Payé ». Une mensualité compte quand les virements de tous les contributeurs sont arrivés (réglage dans Foyer). Les mois précédents sont supposés équilibrés.</p>`},
  'prov-next':{title:'Prochains prélèvements du mois', body:`<p>Les prélèvements mensuels pas encore passés (prêts, factures, abonnements), regroupés par date. Le montant d’une ligne sans jour ou payée par carte est étalé sur le mois et n’apparaît pas ici.</p>`},
  'prov-due':{title:'Dépenses de provision à régler', body:`<p>Les dépenses qui ne tombent pas tous les mois et dont la date de fin est ce mois-ci, ou déjà dépassée.</p><p>Quand tu les as réglées, appuie sur <b>Payé</b> : tu indiques le montant et si le paiement est <b>partiel</b> (tu compléteras plus tard) ou <b>final</b> (le suivi repart de zéro, l’écart va dans la cagnotte).</p>`},
  'prov-flow':{title:'Du compte d’aujourd’hui à l’objectif', body:`<p>On part de l’argent présent aujourd’hui sur le compte et on retire ce qui va sortir ce mois-ci : les prélèvements mensuels à venir, puis les dépenses de provision du mois.</p><p>Il reste la <b>provision restante</b> : ton objectif, le matelas sur lequel tu peux compter une fois le mois passé.</p>`},
  'prov-traj':{title:'Trajectoire de la provision', body:`<p>La courbe montre ce que devrait contenir le compte provisions à la fin de chacun des 12 prochains mois, une fois les prélèvements mensuels passés.</p><p>Les creux correspondent aux grosses dépenses (permis, voiture…). Hypothèse : chaque dépense est payée à sa date de fin, puis le suivi repart de zéro.</p>`},
  repartition:{title:'Répartition du budget commun', body:`<p>Le budget commun (loyer, prêts, courses…) est financé par les adultes qui participent. Tu choisis comment le partager :</p>
    <ul><li><b>Reste à vivre égal</b> : chacun garde la même somme après le commun ; celui qui gagne plus verse plus.</li><li><b>Prorata des revenus</b> : chacun verse la même part de son revenu.</li><li><b>Parts égales</b> : chacun verse le même montant.</li><li><b>Pourcentages</b> : tu fixes toi-même les parts (onglet Foyer).</li></ul>`},
  virements:{title:'Virements à programmer', body:`<p>Pour chaque membre : sa part du budget commun, à virer vers le compte de provision, plus ses dépenses personnelles, à virer vers ses propres comptes.</p><p class="note">Le jour du virement se règle dans Foyer.</p>`},
  'categories-syn':{title:'Dépenses par catégorie', body:`<p>Les familles de dépenses du mois, de la plus lourde à la plus légère. La barre distingue le commun (vert) du personnel (bleu).</p><p>Appuie sur une catégorie pour voir ses lignes ; une seule reste ouverte à la fois. Le détail se modifie dans Budget.</p>`},
  annee:{title:'Sur l’année', body:`<p>Mois par mois : le budget commun, ce que chaque contributeur verse et le reste à vivre. Appuie sur un mois pour l’afficher en haut.</p><p>Les dépenses non mensuelles sont provisionnées chaque mois ; les lignes limitées à certains mois (école, taxe…) n’apparaissent que ces mois-là.</p>`},
  'par-compte':{title:'Par compte', body:`<p>Pour le mois affiché : ce qui sort (débits) et ce qui entre (crédits) sur chaque compte, d’après le compte cible de chaque ligne. Une ligne répartie entre plusieurs comptes est ventilée.</p>`},
  conseils:{title:'Conseils', body:`<p>Des observations calculées sur tes propres chiffres : poids du logement, épargne, lignes à compléter, provisions, compte provisions…</p><p>Les repères (33 % pour le logement, 10 à 20 % d’épargne) sont indicatifs. Aucune donnée ne quitte l’appareil. Appuie sur un conseil pour aller à l’élément concerné.</p>`},
  idees:{title:'Pense à budgéter', body:`<p>Les gros achats ne préviennent pas. Les lisser sur leur durée de vie évite le coup dur.</p><p class="note">Exemple : 4 pneus à 400 € tous les 4 ans → 400 ÷ 48 mois ≈ 8,33 € à mettre de côté chaque mois.</p><p>« Ajouter au budget » préremplit la ligne ; indique ensuite la date du dernier achat pour suivre l’échéance dans Provisions.</p>`},
  budget:{title:'Budget', body:`<p>Toutes tes lignes de dépenses et de revenus, rangées par catégorie. Appuie sur une ligne pour la modifier.</p>
    <ul><li>Les filtres (catégorie, propriétaire, type, « à compléter ») se combinent ; « Effacer les filtres » les remet à zéro.</li><li>La case à gauche d’une ligne l’inclut ou non dans le calcul.</li><li>Une ligne a un cycle (mensuel, annuel…), un jour, un compte et, si besoin, une répartition entre plusieurs comptes.</li><li>Un montant nul à chaque échéance est possible (frais remboursés par la banque, par exemple).</li></ul>`},
  membres:{title:'Membres du foyer', body:`<p>Chaque personne du foyer : adulte, adolescent ou enfant. Un adulte a un salaire et peut participer au budget commun. Un enfant peut recevoir de l’argent de poche, versé par un ou plusieurs adultes : une seule ligne répartie entre leurs comptes.</p><p class="note">Pour chaque contributeur : la date de versement du salaire et le mois qu’il finance.</p>`},
  provisions:{title:'Provisions', body:`<p>Les dépenses qui ne tombent pas tous les mois, avec pour chacune :</p>
    <ul><li><b>Mensualité</b> mise de côté</li><li><b>Somme en cours</b> : mensualités reçues depuis la date de départ, arrondie à l’euro inférieur</li><li><b>Reste</b> à provisionner, ou <b>dépassement</b> d’objectif</li><li><b>Date de fin</b> : départ + cycle</li></ul>
    <p>La somme n’est jamais plafonnée. Quand tu règles une dépense, appuie sur <b>Payé</b> : paiement partiel (la ligne reste à compléter) ou final (le suivi repart, l’écart va dans la cagnotte).</p>`},
  donnees:{title:'Données', body:`<p>Tes données sont dans un fichier JSON sur ton appareil (<b>MaTirelire.json</b> par défaut), jamais envoyées sur Internet. Sur Chrome ou Edge, le fichier se met à jour automatiquement ; ailleurs, utilise « Exporter » puis « Ouvrir ».</p><p>Une copie de secours reste dans ce navigateur, au cas où.</p>`},
  apparence:{title:'Apparence', body:`<p>Personnalise MaTirelire sans toucher à tes chiffres.</p><ul><li><b>Skin</b> : les couleurs de l’appli (Tirelire, Océan, Forêt, Pastel, Minuit, Contraste élevé).</li><li><b>Mode</b> : clair, sombre, ou automatique selon ton appareil. Minuit est toujours sombre.</li><li><b>Mascotte</b> : cochon, toucan, écureuil, hibou ou renard. Elle se choisit indépendamment du skin et a ses propres répliques.</li></ul><p class="note">Ces choix sont enregistrés dans ton fichier.</p>`},
  icone:{title:'Icône de l’écran d’accueil', body:`<p>iOS lit l’icône d’une application web <b>une seule fois, au moment où tu l’ajoutes</b> à l’écran d’accueil. MaTirelire prépare donc l’icône de ta mascotte et de ton skin, mais pour la changer sur l’écran d’accueil :</p>
    <ol><li><b>Exporte ton fichier</b> (Réglages › Données › Exporter) : la copie de secours est liée à l’icône installée.</li><li>Retire l’ancienne icône : appui long, puis « Supprimer l’app ».</li><li>Dans Safari, ouvre MaTirelire, puis Partager › « Sur l’écran d’accueil ».</li><li>Ouvre la nouvelle icône et rouvre ton fichier si besoin.</li></ol>
    <p class="note">« Suit la mascotte » : l’icône change avec ton choix. « Reste le cochon » : l’icône d’origine est conservée. L’icône de l’onglet du navigateur change tout de suite.</p>`},
  apropos:{title:'À propos', body:`<p>La version et le <b>build</b> identifient exactement la page qui tourne sur ton appareil. Si le build ne correspond pas à celui que je t’annonce, tu utilises une ancienne copie en mémoire.</p><p><b>Rechercher une mise à jour</b> compare ton build à celui de la page en ligne (ta demande ne contient aucune donnée). S’il est plus récent, « Mettre à jour » recharge la page sans toucher à tes données.</p><p class="note">Sur l’icône de l’écran d’accueil, exporte ton fichier avant de la supprimer et de la recréer.</p>`},
  comptes:{title:'Comptes', body:`<p>Tes comptes bancaires. Le <b>compte de provision</b> reçoit les virements de chacun pour le budget commun et règle les dépenses.</p><p>Chaque ligne du budget peut être rattachée à un compte cible, ce qui alimente les virements à programmer.</p>`},
  'prov-reglage':{title:'Compte provisions (réglage)', body:`<p>Affiche ou masque le bloc « Compte provisions » de la Synthèse. Masqué, les réglages de versement du salaire disparaissent aussi de Foyer.</p>`},
  cats:{title:'Catégories', body:`<p>Les familles qui regroupent tes lignes (Logement, Transports…). Tu peux les renommer, changer leur couleur et les réordonner. Supprimer une catégorie remet ses lignes dans « Divers ».</p>`},
  moyens:{title:'Moyens de paiement', body:`<p>Prélèvement, virement, chèque, carte… Chaque ligne en a un. Les lignes payées par carte ou en espèces sont étalées sur le mois dans le bloc Compte provisions.</p>`},
  devise:{title:'Devise', body:`<p>La monnaie d’affichage des montants. Elle ne convertit rien : elle change seulement le symbole.</p>`},
};
const IICON = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".75"/><circle cx="8" cy="5.1" r=".95" fill="currentColor"/><path d="M8 7.5v4.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const H = (id, cls) => HELP[id] ? `<button type="button" class="ibtn ${cls || ''}" data-act="help" data-id="${id}" aria-label="Aide : ${esc(HELP[id].title)}" aria-expanded="false" aria-haspopup="dialog" title="Aide">${IICON}</button>` : '';
/* Bulle d'aide ancrée sous le « i » (une seule à la fois) */
let POP = null;
function closePop(focusBack){
  if(!POP) return;
  POP.el.remove(); POP.btn.setAttribute('aria-expanded', 'false'); POP.btn.removeAttribute('aria-controls');
  if(focusBack && document.body.contains(POP.btn)) POP.btn.focus();
  POP = null;
}
function placePop(){
  const {el, btn} = POP, r = btn.getBoundingClientRect(), vw = document.documentElement.clientWidth, vh = window.innerHeight, inner = $('.pop-in', el);
  const w = Math.min(330, vw - 24); el.style.width = w + 'px';
  const left = Math.min(Math.max(r.left + r.width / 2 - w / 2, 12), vw - 12 - w);
  el.style.left = (left + window.scrollX) + 'px';
  el.style.setProperty('--ax', Math.round(r.left + r.width / 2 - left) + 'px');
  inner.style.maxHeight = Math.max(180, Math.min(0.6 * vh, vh - 160)) + 'px';
  const navH = 78, h = el.offsetHeight, below = vh - navH - r.bottom - 10, above = r.top - 70 - 10;
  const up = h > below && above > below && above >= Math.min(h, 200);
  el.classList.toggle('up', up);
  el.style.top = (up ? r.top + window.scrollY - h - 10 : r.bottom + window.scrollY + 10) + 'px';
  if(!up){ const need = r.bottom + 10 + h - (vh - navH); if(need > 0) window.scrollBy({top:Math.min(need, Math.max(0, r.top - 70)), behavior:'smooth'}); }
}
function openPop(btn, id){
  const h = HELP[id]; if(!h) return;
  if(POP && POP.btn === btn){ closePop(); return; }
  closePop();
  const el = document.createElement('div');
  el.className = 'pop'; el.id = 'pop'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', h.title);
  el.innerHTML = `<div class="pop-in"><h4>${esc(h.title)}</h4>${h.body}</div>`;
  document.body.appendChild(el);
  btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-controls', 'pop');
  POP = {el, btn}; placePop();
}
document.addEventListener('pointerdown', e => { if(POP && !e.target.closest('.pop') && !e.target.closest('.ibtn')) closePop(); }, true);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && POP){ e.preventDefault(); closePop(true); } });
window.addEventListener('resize', () => closePop());

function envMonthYear(){ const n = new Date(); return {y:n.getFullYear(), m:U.month === 0 ? n.getMonth() + 1 : U.month}; }
function toastUndo(msg, undo){
  toast(msg);
  const t = $('#toast'); if(!t || !undo) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-undo'; b.textContent = 'Annuler';
  b.onclick = () => { undo(); t.classList.add('hidden'); };
  t.appendChild(b); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 7000);
}
function envBarClass(x){ return x.over > 0.005 ? 'bad' : (x.pct >= 0.8 ? 'warn' : 'ok'); }

    <div class="chips wrapchips">${kids.map(m => { const st = kidStage(ensureKid(m)); return `<button type="button" class="chip" data-act="kid-open" data-id="${esc(m.id)}">${esc(m.name)}${st.age === null ? ' · âge ?' : (st.locked ? ` · dès 6 ans` : ` · ${st.age} ans`)}${m.kid.on && !st.locked ? ` · ${money(kidTotal(m.kid))}` : ''}</button>${m.kid.on && !st.locked ? `<button type="button" class="chip ghostchip" data-act="kid-report-open" data-id="${esc(m.id)}" aria-label="Bilan du mois de ${esc(m.name)}">Bilan</button>` : ''}`; }).join('')}</div>
    <div class="toolbar"><button type="button" class="btn small" data-act="kid-import">Importer un espace enfant</button></div></section>`;
}
function envelopeCardHTML(){
  const {y, m} = envMonthYear(), E = envelopeStats(S, y, m), cand = envelopeCandidates(S);
  const showGuide = cand.length > 0 && !S.settings.envGuideHidden;
  const guide = showGuide ? `<div class="envguide"><h3 class="who">Suivre mes dépenses variables ${H('env-guide')}</h3>
    <p class="hint">Ces lignes ressemblent à des dépenses variables. Coche celles que tu veux suivre au fil du mois :</p>
    <ul class="guidelist">${cand.slice(0, 6).map(l => `<li><label class="check"><input type="checkbox" data-g="${esc(l.id)}" checked> <span>${esc(l.name)} <small class="muted">${money(l.amount)} par mois</small></span></label></li>`).join('')}</ul>
    ${cand.length > 6 ? `<p class="note">${cand.length - 6} autre${cand.length - 6 > 1 ? 's' : ''} ligne${cand.length - 6 > 1 ? 's' : ''} : à convertir depuis Budget.</p>` : ''}
    <div class="toolbar"><button type="button" class="btn primary small" data-act="env-guide-create">Créer les enveloppes</button><button type="button" class="btn small" data-act="env-guide-hide">Plus tard</button></div></div>` : '';
  const rows = E.items.map(x => {
    const w = Math.min(100, Math.round(x.pct * 100));
    const sub = x.over > 0.005 ? `<span class="debit">Dépassement +${money(x.over)}</span>` : `<span>Reste ${money(x.left)}${E.isCur && x.perDay > 0 ? ` · ≈ ${money(x.perDay)} par jour` : ''}</span>`;
    return `<div class="envrow"><button type="button" class="env-main" data-act="env-open" data-id="${esc(x.id)}" aria-label="Voir les dépenses : ${esc(x.name)}">
        <span class="env-top"><b>${esc(x.name)}</b><span class="env-amt">${money(x.spent)} <small>sur ${money(x.planned)}</small></span></span>
        <span class="env-bar" role="img" aria-label="${w} % dépensé"><i class="${envBarClass(x)}" style="width:${w}%"></i></span>
        <span class="env-sub">${sub}</span></button>
      <button type="button" class="btn env-plus" data-act="env-add" data-id="${esc(x.id)}" aria-label="Déclarer une dépense : ${esc(x.name)}">+</button></div>`;
  }).join('');
  const total = E.items.length > 1 ? `<div class="envtotal"><span>Total : ${money(E.spent)} sur ${money(E.planned)}</span>${E.over > 0.005 ? `<span class="debit">Dépassement +${money(E.over)}</span>` : ''}</div>` : '';
  const empty = !E.items.length && !showGuide ? `<p class="hint">Aucune enveloppe pour l’instant. Une enveloppe est une somme prévue pour le mois (courses, essence…), que tu déclares au fil des achats.</p>` : '';
  return `<section class="card env" aria-label="Enveloppes du mois"><header><h2>Enveloppes · ${MONTHS[m - 1]} ${H('env')}</h2><button type="button" class="btn small" data-act="env-new">Nouvelle enveloppe</button></header>
    ${empty}${guide}${rows}${total}</section>`;
}
function dlgShell(title, body, foot){
  return `<div class="dlg-h"><h2>${title}</h2><button class="btn ghost small" data-act="close-dlg" aria-label="Fermer">✕</button></div><div class="dlg-b form">${body}</div><div class="dlg-f">${foot}</div>`;
}
function focusQuiet(el){ if(el) try{ el.focus({preventScroll:true}); }catch{ el.focus(); } }
/* Déclarer (ou modifier) une dépense */
function openSpend(lineId, spendId){
  const l = S.lines.find(x => x.id === lineId); if(!l) return;
  const sp = spendId ? (S.spends || []).find(x => x.id === spendId) : null, {y, m} = envMonthYear();
  const E = envelopeStats(S, y, m), it = E.items.find(x => x.id === lineId);
  const dflt = (y === new Date().getFullYear() && m === new Date().getMonth() + 1) ? isoToday() : `${y}-${String(m).padStart(2, '0')}-01`;
  U.spendCtx = {lineId, spendId:spendId || null};
  const mini = it ? `<p class="envmini">${money(it.spent)} dépensés sur ${money(it.planned)} · ${it.over > 0.005 ? `<span class="debit">dépassement +${money(it.over)}</span>` : `reste ${money(it.left)}`}</p>` : '';
  const dlg = $('#dlg'); U.editing = null;
  dlg.innerHTML = dlgShell(`${sp ? 'Modifier la dépense' : 'Dépense'} · ${esc(l.name)}`, `${mini}
    <label class="field">Montant<input class="inp bigamt" id="sp-amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00" value="${sp ? sp.amount : ''}" enterkeyhint="done"></label>
    <div class="grid2"><label class="field">Date<input class="inp" id="sp-date" type="date" value="${esc(sp ? sp.date : dflt)}"></label>
      <label class="field">Note (facultatif)<input class="inp" id="sp-note" value="${esc(sp ? sp.note : '')}" placeholder="Ex. Carrefour" autocomplete="off" enterkeyhint="done"></label></div>`,
    `${sp ? '<button type="button" class="btn danger" data-act="spend-del">Supprimer</button>' : '<span></span>'}<div class="r"><button type="button" class="btn" data-act="close-dlg">Annuler</button><button type="button" class="btn primary" data-act="spend-save">${sp ? 'Enregistrer' : 'Ajouter'}</button></div>`);
  dlg.showModal(); focusQuiet($('#sp-amount'));
}
function saveSpend(){
  const c = U.spendCtx; if(!c) return;
  const amount = Math.abs(num($('#sp-amount').value)), date = $('#sp-date').value, note = $('#sp-note').value.trim();
  if(!(amount > 0)){ toast('Saisis le montant dépensé.'); focusQuiet($('#sp-amount')); return; }
  if(!parseISO(date)){ toast('Choisis la date de la dépense.'); return; }
  const l = S.lines.find(x => x.id === c.lineId);
  if(c.spendId){ const sp = S.spends.find(x => x.id === c.spendId); if(sp){ sp.amount = amount; sp.date = date; sp.note = note; } $('#dlg').close(); touch(); toast('Dépense modifiée'); return; }
  const sp = addSpend(S, c.lineId, amount, date, note); $('#dlg').close(); touch();
  const {y, m} = envMonthYear(), it = envelopeStats(S, y, m).items.find(x => x.id === c.lineId);
  toastUndo(`${money(amount)} ajoutés à ${l ? l.name : 'l’enveloppe'}${it && it.over > 0.005 ? ' · enveloppe dépassée' : ''}`, () => { S.spends = S.spends.filter(x => x.id !== sp.id); touch(); });
}
/* Historique d'une enveloppe */
function openEnvelope(lineId){
  const l = S.lines.find(x => x.id === lineId); if(!l) return;
  const {y, m} = envMonthYear(), E = envelopeStats(S, y, m), it = E.items.find(x => x.id === lineId) || {planned:amountInMonth(l, m), spent:0, left:0, over:0};
  const list = (S.spends || []).filter(x => x.lineId === lineId && x.date.startsWith(`${y}-${String(m).padStart(2, '0')}`)).sort((a, b) => b.date.localeCompare(a.date));
  const dlg = $('#dlg'); U.editing = null; U.spendCtx = null;

/* ---------- Simulateurs ---------- */
function simChart(pts){
  const W = 300, H = 110, pad = 8, max = Math.max(...pts, 1), n = pts.length - 1, X = i => pad + (W - 2 * pad) * (n ? i / n : 0), Y = v => H - pad - (H - 2 * pad) * (v / max);
  const line = pts.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg class="simchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de l’épargne dans le temps" focusable="false"><polygon points="${X(0)},${H - pad} ${line} ${X(n)},${H - pad}" fill="var(--kj-save, var(--credit))" fill-opacity=".22"/><polyline points="${line}" fill="none" stroke="var(--kj-save, var(--credit))" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(n)}" cy="${Y(pts[n])}" r="4.5" fill="var(--kj-save, var(--credit))"/></svg>`;
}
const SIM_TITLES = {savings:'Et si j’épargne chaque mois ?', sub:'Combien coûte vraiment un abonnement ?', use:'Quel prix par usage ?'};
function simOut(){
  const t = U.sim && U.sim.type, v = id => num(($('#' + id) || {value:0}).value), f = x => money(x);
  if(t === 'savings'){
    const r = simSavings({monthly:v('sim-monthly'), months:+$('#sim-months').value, annualPct:+$('#sim-rate').value, start:v('sim-start')}), yrs = r.months >= 12 ? `${Math.floor(r.months / 12)} an${r.months >= 24 ? 's' : ''}${r.months % 12 ? ` et ${r.months % 12} mois` : ''}` : `${r.months} mois`;
    return `${simChart(r.points)}<p class="simbig">${f(r.final)}</p><p class="khint">Après ${yrs}. Tu auras mis <b>${f(r.deposits)}</b>${r.interest > 0.004 ? `, et les intérêts t’apportent <b>${f(r.interest)}</b>` : ' (sans intérêts)'}.</p><p class="note">Simulation indicative : les taux réels changent.</p>`;
  }
  if(t === 'sub'){ const r = simSub({amount:v('sim-amount'), years:+$('#sim-years').value}); return `<p class="simbig">${f(r.year)} <small>par an</small></p><p class="khint">Soit <b>${f(r.total)}</b> en ${r.years} an${r.years > 1 ? 's' : ''}. Avec cet argent, tu pourrais t’offrir autre chose : est-ce que l’abonnement le vaut vraiment ?</p>`; }
  const r = simPerUse({price:v('sim-price'), uses:v('sim-uses')}); return r === null ? '<p class="khint">Indique combien de fois tu l’utiliseras.</p>' : `<p class="simbig">${f(r)} <small>par usage</small></p><p class="khint">${f(v('sim-price'))} utilisés ${Math.floor(v('sim-uses'))} fois. Plus tu l’utilises, moins chaque usage coûte.</p>`;
}

function sparkHTML(proj){
  const vals = proj.map(x => x.balance), n = vals.length;
  const min = Math.min(...vals), max = Math.max(...vals), W = 320, H = 112, pl = 8, pr = 8, pt = 16, pb = 32, rng = (max - min) || 1;
  const X = i => pl + (W - pl - pr) * i / (n - 1), Y = v => pt + (H - pt - pb) * (1 - (v - min) / rng);
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const imin = vals.indexOf(min), imax = vals.indexOf(max);
  const anchor = i => i > n - 3 ? 'end' : i < 2 ? 'start' : 'middle';
  const lab = (i, up) => `<circle class="spark-dot" cx="${X(i).toFixed(1)}" cy="${Y(vals[i]).toFixed(1)}" r="3.2"/><text class="spark-txt strong" x="${X(i).toFixed(1)}" y="${(Y(vals[i]) + (up ? -7 : 14)).toFixed(1)}" text-anchor="${anchor(i)}">${esc(money(vals[i], 0))}</text>`;
  const ticks = [0, 3, 6, 9, 11].filter(i => i < n).map(i => `<text class="spark-txt" x="${X(i).toFixed(1)}" y="${H - 4}" text-anchor="${anchor(i)}">${MONTHS_SHORT[proj[i].m - 1]}</text>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Solde attendu du compte provisions à la fin de chacun des 12 prochains mois : de ${esc(money(min, 0))} à ${esc(money(max, 0))}">
    <path class="spark-area" d="M${X(0).toFixed(1)},${H - pb} L${pts.join(' L')} L${X(n-1).toFixed(1)},${H - pb} Z"/><polyline class="spark-line" points="${pts.join(' ')}"/>

function bubbleMessages(R){
  const order = {alert:0, warn:1, info:2, good:3}, all = computeAdvice(S);
  U.moodNow = mascotMoodFor(R, new Set(all.map(a => a.kind)));
  const adv = all.sort((a, b) => order[a.severity] - order[b.severity])
    .map(it => ({type:'advice', kind:it.kind, severity:it.severity, go:!!(it.action && it.action.tab), text:((ADVICE_META[it.kind] || (() => ({title:''})))(it.data, it.severity)).title}))
    .filter(m => m.text);
  const own = MASCOT_INFO[currentLook().mascot].jokes, jokes = [{type:'joke', text:heroMsg(R)}, ...own.slice(0, 2), ...JOKES_COMMON.slice(0, 4), ...own.slice(2), ...JOKES_COMMON.slice(4)].map(x => typeof x === 'string' ? {type:'joke', text:x} : x);
  const out = [];

   compte provisions ou cagnotte négatifs) ou s'il n'y a aucune épargne. Une ligne trop lourde (logement…) ne l'assombrit pas. */
function mascotMoodFor(R, kinds){
  if(R.totals.rest < -0.005) return 'worried';
  if(kinds.has('annuel-negatif') || kinds.has('epargne-absente')) return 'worried';
  if(provisionOn()){ const C = provisionSummary(S).cash; if(C.state < -0.005 || C.pot < -0.005) return 'worried'; }
  return 'happy';
}
function bubbleMood(){ return U.moodNow || 'happy'; }
function bubbleHTML(){
  const m = bubbleCurrent(); if(!m) return '';

  return `${piggy(bubbleMood(), 92, 'nocoin')}<button type="button" class="bubble ${m.type === 'advice' ? (m.go ? 'adv ' : 'note ') + 'sev-' + m.severity : 'joke'}" data-act="bubble" aria-label="${esc(label)}"><span class="txt">${esc(m.text)}</span>${m.go ? '<span class="go" aria-hidden="true">›</span>' : ''}</button>`;
}
function swapBubble(){
  const box = $('.hero-pig'); if(!box) return;
  U.bubbleChanged = Date.now();
  const apply = () => { box.dataset.mood = bubbleMood(); box.innerHTML = bubbleHTML(); };
  if(reducedMotion()){ apply(); return; }
  box.classList.add('swap');
  setTimeout(() => { apply(); box.classList.remove('swap'); }, 180);
}
function bubbleTick(){
  if(!S || U.tab !== 'synthese' || document.hidden || reducedMotion()) return;
  if(U.bubbleHover || U.bubbleFocus || Date.now() < (U.bubbleHold || 0) || ($('#dlg') && $('#dlg').open)) return;
  if(!U.bubbleList || U.bubbleList.length < 2) return;
  if(Date.now() - (U.bubbleChanged || 0) < BUBBLE_MS) return;
  U.bubbleIdx = (U.bubbleIdx || 0) + 1; swapBubble();
}
function goAdvice(kind){
  const it = computeAdvice(S).find(x => x.kind === kind); if(!it || !it.action) return;
  const act = it.action;
  U.tab = act.tab; if(act.todo) U.todo = true; if(act.month != null) U.month = act.month;
  render(); window.scrollTo(0, 0);
  if(act.lineId) openLine(act.lineId);
}

const kwMatch = (n, k) => new RegExp('(^| )' + k + '(s|x)?( |$)').test(n);
const ideaPresent = i => S.lines.some(l => { const n = advNorm(l.name); return i.kw.some(k => kwMatch(n, k)); });
function ideaRelevant(i){
  if(i.kids && !S.members.some(m => m.type === 'child' || m.type === 'teen')) return false;
  if(i.needs){
    const pool = S.lines.map(l => advNorm(l.name)).concat(S.categories.map(c => advNorm(c.name)));
    if(!i.needs.some(k => pool.some(n => n.includes(k)))) return false;
  }
  return true;
}
function ideaCat(i){
  const hit = S.categories.find(c => i.hints.some(h => advNorm(c.name).includes(h)));
  if(hit) return hit.id;
  const before = S.categories.length, c = ensureCategory(S, i.cat);
  if(S.categories.length > before) U.tempCat = c.id;
  return c.id;
}
function ideaPerMonth(i){ return annualTotal({amount:i.amount, cycle:i.cycle, months:null, active:true}) / 12; }
function everyText(c){
  if(c.unit === 'year') return c.every === 1 ? 'par an' : `tous les ${c.every} ans`;
  if(c.unit === 'month') return c.every === 1 ? 'par mois' : `tous les ${c.every} mois`;
  return cycleLabel(c).toLowerCase();
}

function viewConseils(){
  const items = computeAdvice(S);
  if(!items.length) return `<section class="card"><div class="conseils-head">${piggy('happy',56,'nocoin')}<div><h2>Conseils ${H('conseils')}</h2><p class="hint">Complète quelques montants dans l’onglet Budget : les conseils s’affinent à partir de tes vrais chiffres.</p></div></div></section>${ideasSection()}`;
  const order = {alert:0, warn:1, info:2, good:3};
  items.sort((a,b) => order[a.severity] - order[b.severity]);
  const n = items.filter(x => x.severity === 'alert' || x.severity === 'warn').length;
  const cards = items.map(it => {
    const meta = (ADVICE_META[it.kind] || (() => ({title:it.kind, text:''})))(it.data, it.severity);
    const clickable = !!(it.action && (it.action.tab));
    return `<article class="advice sev-${it.severity} ${clickable?'click':''}" ${clickable?`data-act="advice" data-kind="${esc(it.kind)}"`:''} ${clickable?'role="button" tabindex="0"':''}>
      <div class="a-h"><span class="a-tag">${SEV_LABEL[it.severity]}</span><h3>${esc(meta.title)}</h3></div>
      <p>${meta.text}</p></article>`;
  }).join('');
  return `<section class="sect"><div class="conseils-head">${piggy(n?'worried':'happy',56,'nocoin')}<div><h2>Conseils ${H('conseils')}</h2><p class="hint">${n ? `${n} point${n>1?'s':''} à regarder en priorité.` : 'Tout est plutôt sain, d’après tes chiffres actuels.'}</p></div></div>
    <div class="advice-list">${cards}</div></section>
    ${ideasSection()}
    <p class="note">Ces repères sont indicatifs (comparaisons courantes), pas un conseil financier personnalisé ni professionnel. Aucune donnée ne quitte cet appareil pour produire cette analyse.</p>`;
}

/* ----- Budget : liste des lignes ----- */
const activeFilters = () => (U.q.trim() ? 1 : 0) + (U.owner !== 'all' ? 1 : 0) + (U.kind !== 'all' ? 1 : 0) + ((U.cat && U.cat !== 'all') ? 1 : 0) + (U.todo ? 1 : 0);
const lineOwners = l => linePartsOf(l).map(p => p.ownerId);
function viewBudget(){
  const owners = [['all','Tout le monde'],['common','Commun'],...S.members.map(m => [m.id, m.name])];
  if(U.cat && U.cat !== 'all' && !S.categories.some(c => c.id === U.cat)) U.cat = 'all';
  const todoCount = S.lines.filter(l => l.active && l.amount === 0 && !l.zero).length, nf = activeFilters();
  return `<div class="pagehead"><h2>Budget ${H('budget')}</h2></div><section class="toolbar">
      <input class="inp grow" id="q" type="search" placeholder="Rechercher une ligne…" value="${esc(U.q)}" aria-label="Rechercher">
      <select class="inp" id="flt-cat" style="width:auto" aria-label="Filtrer par catégorie"><option value="all">Toutes les catégories</option>${S.categories.map(c => `<option value="${esc(c.id)}" ${U.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select class="inp" id="flt-owner" style="width:auto" aria-label="Filtrer par propriétaire">${owners.map(([v,l]) => `<option value="${esc(v)}" ${U.owner===v?'selected':''}>${esc(l)}</option>`).join('')}</select>
      <select class="inp" id="flt-kind" style="width:auto" aria-label="Filtrer par type"><option value="all" ${U.kind==='all'?'selected':''}>Débits et crédits</option><option value="debit" ${U.kind==='debit'?'selected':''}>Débits</option><option value="credit" ${U.kind==='credit'?'selected':''}>Crédits</option></select>
      <button class="chip" data-act="todo" aria-pressed="${U.todo}">À compléter (${todoCount})</button>
      <button class="btn primary" data-act="add-line">Ajouter une ligne</button>
    </section>

function clearBarHTML(){
  const n = activeFilters();
  return n ? `<div class="clearbar"><span class="muted">${n} filtre${n > 1 ? 's' : ''} actif${n > 1 ? 's' : ''}</span><button class="btn small" data-act="clear-filters">Effacer les filtres</button></div>` : '';
}
function refreshBudgetList(){ const l = $('#list'), c = $('#clearbar'); if(l) l.innerHTML = listHTML(); if(c) c.innerHTML = clearBarHTML(); const t = $('[data-act=todo]'); if(t) t.setAttribute('aria-pressed', U.todo); }
function listHTML(){
  const q = U.q.trim().toLowerCase(), filtering = activeFilters() > 0;
  const match = l => (U.owner === 'all' || lineOwners(l).includes(U.owner)) && (U.kind === 'all' || l.kind === U.kind) && (!U.cat || U.cat === 'all' || l.catId === U.cat) &&
    (!q || l.name.toLowerCase().includes(q) || catById(l.catId).name.toLowerCase().includes(q)) && (!U.todo || (l.active && l.amount === 0 && !l.zero));
  let html = '', shown = 0, sumD = 0, sumC = 0;
  ENV_CAND = new Set(envelopeCandidates(S).map(l => l.id));
  S.categories.forEach(c => {
    const all = S.lines.filter(l => l.catId === c.id), lines = all.filter(match);
    if(filtering && !lines.length) return;
    const net = lines.reduce((a,l) => a + (l.kind === 'credit' ? 1 : -1) * monthlyAverage(l), 0);
    lines.forEach(l => { shown++; if(l.kind === 'credit') sumC += monthlyAverage(l); else sumD += monthlyAverage(l); });
    const open = !U.collapsed[c.id];
    html += `<section class="catbox"><div class="cathead"><button class="tog" data-act="toggle-cat" data-id="${c.id}" aria-expanded="${open}"><span class="sw-dot" style="background:${esc(c.color)}"></span>${esc(c.name)} <span class="muted" style="font-weight:500">(${lines.length})</span></button>
      <span class="tot ${net<0?'debit':net>0?'credit':''}">${net ? money(net,0) + '/mois' : ''}</span>
      <button class="btn small" data-act="add-line" data-cat="${c.id}" aria-label="Ajouter une ligne dans ${esc(c.name)}">＋</button></div>
      ${open ? (lines.length ? lines.map(lineRow).join('') : '<p class="empty">Aucune ligne dans cette catégorie.</p>') : ''}</section>`;
  });
  if(!S.categories.length) html = '<p class="empty">Aucune catégorie : en créer dans Réglages.</p>';
  if(filtering && !shown) html = '<p class="empty">Aucune ligne ne correspond aux filtres.</p>';
  else if(filtering) html += `<p class="note">Lignes affichées : débits ${money(sumD)} par mois, crédits ${money(sumC)} par mois (moyennes lissées).</p>`;
  return html;
}
function summaryNote(sum){
  switch(sum.mode){
    case 'smoothed':  return `≈ ${money(sum.monthly)}/mois`;
    case 'monthly':   return `${money(sum.monthly)}/mois`;
    case 'partial':   return `${money(sum.monthly)}/mois (${sum.months.length} mois/an)`;
    case 'occurrence':return `${money(sum.amount)} à l’échéance`;
    default: return '';
  }
}
function splitText(l){
  if(!(Array.isArray(l.split) && l.split.length > 1)) return '';
  const tot = l.split.reduce((a, p) => a + p.pct, 0) || 1;
  return l.split.map(p => `${Math.round(p.pct * 100 / tot)} % ${p.accountId ? accName(p.accountId) : memberName(p.ownerId)}`).join(' · ');
}
let ENV_CAND = new Set();
function lineRow(l){
  const c = l.cycle, parts = Array.isArray(l.split) && l.split.length > 1;
  const metas = [cycleLabel(c) + (l.day && c.unit !== 'day' && c.unit !== 'week' ? `, le ${l.day}` : ''), methodLabel(l.method),
    parts ? splitText(l) : (l.accountId ? accName(l.accountId) : ''), !parts && l.ownerId !== 'common' ? memberName(l.ownerId) : '',
    l.zero ? 'montant nul à chaque échéance' : '', l.envelope ? 'enveloppe' : '', l.auto === 'pocket' ? 'géré dans Foyer' : '']
    .filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('') + (ENV_CAND.has(l.id) ? `<button type="button" class="linklike" data-act="env-convert" data-id="${esc(l.id)}">Suivre au fil du mois</button>` : '');
  const empty = l.amount === 0 && !l.zero, sum = (l.amount === 0 || !l.active) ? null : lineSummary(l);
  return `<div class="line ${l.active?'':'off'}" data-act="edit-line" data-id="${l.id}" role="button" tabindex="0" aria-label="Modifier ${esc(l.name)}">
    <label class="sw" title="Inclure dans le calcul"><input type="checkbox" data-b="line:${l.id}:active" ${l.active?'checked':''} aria-label="Inclure ${esc(l.name)} dans le calcul"></label>
    <div class="lmain"><span class="lname">${esc(l.name)}</span><i class="dots"></i></div>
    <div class="amt"><b class="${empty?'todo':l.kind}">${empty ? 'à renseigner' : (l.zero ? money(0) : signed(l.kind, l.amount))}</b>${sum ? `<small>${summaryNote(sum)}</small>` : ''}</div>
    <div class="meta">${metas}</div></div>`;
}

/* ----- Provisions ----- */
const provInfo = (l, now, clk) => provisionInfo(l, now, clk || provisionClock(S));
const provLines = () => provisionCandidates(S);
function nextText(p){
  if(p.noStart) return '<span class="muted">à renseigner</span>';
  if(p.monthlyGoal && p.done) return '<span class="credit">objectif atteint</span>';
  if(!p.next) return '<span class="muted">—</span>';
  return `<span class="${p.overdue ? 'debit' : ''}">${p.next.toLocaleDateString('fr-FR', {month:'short', year:'numeric'})}${p.overdue ? ' (dépassée)' : ''}</span>`;
}
const dashIf = (p, v) => p.noStart ? '<span class="muted">—</span>' : money(v);
const restCell = p => p.noStart ? '<span class="muted">—</span>' : (p.over >= 1 ? `<span class="credit">+${money(p.over)}</span> <small class="muted">dépassement</small>` : money(p.rest));
const restClass = p => !p.noStart && p.over < 1 && p.rest > 0.005 ? 'debit' : 'credit';
function provTotals(clk){
  clk = clk || provisionClock(S);
  return provLines().reduce((a, l) => { const p = provInfo(l, undefined, clk); if(!p.noStart){ a.goal += p.goal; a.res += p.reserved; a.rest += p.rest; a.over += p.over; a.mens += p.mens; } return a; }, {goal:0, res:0, rest:0, over:0, mens:0});
}
function viewProvisions(){
  const lines = provLines(), clk = provisionClock(S), tot = provTotals(clk);

function patchProv(id){
  const l = S.lines.find(x => x.id === id); if(!l) return;
  const clk = provisionClock(S), p = provInfo(l, undefined, clk), set = (k, html) => { const el = $(`[data-cell="${k}"]`); if(el) el.innerHTML = html; };
  set(`mens:${id}`, money(p.mens)); set(`goal:${id}`, money(p.goal)); set(`sum:${id}`, dashIf(p, p.reserved));
  const r = $(`[data-cell="rest:${id}"]`); if(r){ r.innerHTML = restCell(p); r.className = restClass(p); }
  set(`next:${id}`, nextText(p));
  const tot = provTotals(clk);
  set('tot:mens', money(tot.mens)); set('tot:goal', money(tot.goal)); set('tot:res', money(tot.res));
  set('tot:rest', `${money(tot.rest)}${tot.over >= 1 ? `<br><small class="credit">dont +${money(tot.over)} de dépassement</small>` : ''}`);
}

  const isNew = !l;

function readLineForm(){
  const g = id => $('#' + id, $('#dlg')), pid = g('f-cycle').value;
  let cycle;
  if(pid === 'custom') cycle = {every:Math.max(1, parseInt(g('f-every').value) || 1), unit:g('f-unit').value, times:Math.max(1, parseInt(g('f-times').value) || 1)};
  else cycle = cycleOf(pid);
  const exact = cycle.unit === 'month' && cycle.every === 1;
  const checked = $$('.mchip input:checked', $('#dlg')).map(i => +i.value);
  const months = exact && checked.length && checked.length < 12 ? checked : null;
  const sm = g('f-smooth').value;
  const cur = S.lines.find(x => x.id === (U.editing||{}).id) || {};
  const kindV = $('input[name=f-kind]:checked', $('#dlg')).value, variable = kindV === 'debit' && $('input[name=f-var]:checked', $('#dlg')).value === 'variable';
  if(variable) cycle = cycleOf('monthly');
  const parts = g('f-splitOn').checked ? readSplit() : null, zero = variable ? false : g('f-zero').checked;
  return {
    id:(U.editing||{}).id, name:g('f-name').value.trim(), catId:g('f-cat').value, kind:$('input[name=f-kind]:checked', $('#dlg')).value,
    amount:zero ? 0 : Math.abs(num(g('f-amount').value)), cycle, day:variable ? null : (parseInt(g('f-day').value) || null), startMonth:variable ? null : (parseInt(g('f-start').value) || null), months:variable ? null : months,
    method:g('f-method').value || null, accountId:(parts && parts.length) ? parts[0].accountId : (g('f-account').value || null), ownerId:(parts && parts.length) ? parts[0].ownerId : g('f-owner').value,

function previewText(sum){
  switch(sum.mode){
    case 'smoothed': return `Environ <b>${money(sum.monthly)}</b> par mois en moyenne, soit <b>${money(sum.annual)}</b> par an (provisionné chaque mois dans le budget, même les mois où elle n’est pas due).`;
    case 'monthly':  return `<b>${money(sum.monthly)}</b> par mois, soit <b>${money(sum.annual)}</b> par an.`;
    case 'partial': {
      const list = sum.months.map(m => MONTHS_SHORT[m-1]).join(', ');
      return `<b>${money(sum.monthly)}</b> par mois, ${sum.months.length} mois sur 12 (${list}), soit <b>${money(sum.annual)}</b> par an. Les autres mois, cette ligne n’apparaît pas dans le budget.`;
    }
    case 'occurrence': return `<b>${money(sum.amount)}</b> à chaque échéance (${sum.cycle}), soit <b>${money(sum.annual)}</b> par an.`;
    default: return 'Renseigner le montant pour voir l’équivalent mensuel.';
  }
}
function saveLine(){
  const l = readLineForm();

  if(!l.catId || l.catId === '__new'){ toast('Choisir une catégorie.'); return; }
  if($('#f-splitOn').checked){
    const tot = (l.split || []).reduce((a, p) => a + p.pct, 0);
    if(!l.split || tot <= 0){ toast('Renseigne la part de chaque source (au moins 2 sources, total supérieur à 0).'); return; }
    l.split = l.split.map(p => ({...p, pct:p.pct * 100 / tot}));
  }

  if(e.key === 'Enter' && e.target.dataset && e.target.dataset.kw && e.target.tagName === 'INPUT'){ e.preventDefault(); const n = $('#kw-next'); if(n && !n.disabled) n.click(); }
  if(e.key === 'Enter' && e.target.id && (e.target.id.startsWith('pin-'))){ e.preventDefault(); pinSubmit(); }
  if(e.key === 'Enter' && e.target.id && (e.target.id === 'kd-amount' || e.target.id === 'kd-note')){ e.preventDefault(); const a = $('#dlg [data-act$=-save], #dlg [data-act=kid-goal-add]'); if(a) a.click(); }
  if(e.key === 'Enter' && e.target.id && (e.target.id === 'kg-name' || e.target.id === 'kg-price')){ e.preventDefault(); const a = $('#dlg [data-act=kid-goal-create]'); if(a) a.click(); }
  if(e.key === 'Enter' && e.target.id && e.target.id.startsWith('pf-')){ e.preventDefault(); confirmPot(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.w && t.tagName === 'INPUT' && t.type !== 'checkbox' && t.type !== 'radio'){ onWizardField(t); return; }
  if(t.dataset && t.dataset.kw && t.tagName === 'INPUT' && t.type !== 'checkbox'){ kwField(t); return; }
  if(e.target.id === 'q'){ U.q = e.target.value; refreshBudgetList(); return; }
  if(e.target.id === 'ne-name'){ neRefresh(); return; }
  if(e.target.id && e.target.id.startsWith('sim-') && $('#sim-out')){ $('#sim-out').innerHTML = simOut(); return; }
  if(e.target.id === 'kd-amount' && $('#kd-wait')){ const km = kidMember(); $('#kd-wait').classList.toggle('hidden', !(km && km.kid.rules.wait > 0 && num(e.target.value) >= BIG_SPEND)); return; }
  if(e.target.id === 'py-amount' || e.target.id === 'py-date'){ paySync(e.target.id === 'py-amount'); return; }
  if(e.target.id === 'rc-real'){ $('#rc-info').innerHTML = recalageInfo(); return; }
  if(e.target.closest('#dlg') && $('#f-preview')) refreshLineForm();
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.w){ onWizardField(el); return; }
  if(el.dataset && el.dataset.kw){ kwField(el); return; }
  if(el.id && el.id.startsWith('sim-') && $('#sim-out')){ $('#sim-out').innerHTML = simOut(); return; }
  if(el.id === 'file-in'){ if(el.files[0]) loadFromInput(el.files[0]); el.value = ''; return; }
  if(el.name === 'py-mode'){ if(U.payCtx) U.payCtx.modeTouched = true; paySync(false); return; }
  if(el.dataset && el.dataset.kp){ kidPanelChange(el); return; }
  if(el.closest('#dlg')){ onDialogChange(el); return; }
  if(el.id === 'flt-cat'){ U.cat = el.value; refreshBudgetList(); return; }
  if(el.id === 'flt-owner'){ U.owner = el.value; refreshBudgetList(); return; }
  if(el.id === 'flt-kind'){ U.kind = el.value; refreshBudgetList(); return; }
  const b = el.dataset.b; if(b) onBind(el, b);
});
function onDialogChange(el){
  if(el.id === 'f-splitOn'){ if(el.checked) writeSplit(defaultSplit()); else { const p = readSplit()[0]; if(p){ $('#f-owner').value = p.ownerId; $('#f-account').value = p.accountId || ''; } } }
  if(el.id === 'f-zero' && el.checked) $('#f-amount').value = '';
  if(el.classList && el.classList.contains('sp-owner')){
    const row = el.closest('.splitrow'), acc = $('.sp-acc', row), cur = accById(acc.value);
    if(!cur || (el.value === 'common' ? cur.ownerId : cur.ownerId !== el.value)) acc.value = defaultAccountFor(S, el.value) || '';
  }
  if(el.id === 'f-owner'){
    const acc = $('#f-account'), cur = accById(acc.value), oid = el.value;
    if(!cur || (oid === 'common' ? cur.ownerId : cur.ownerId !== oid)) acc.value = defaultAccountFor(S, oid) || '';
  }
  if(el.id === 'f-cat' && el.value === '__new'){
    const name = (prompt('Nom de la nouvelle catégorie :') || '').trim();
    if(name){
      const c = ensureCategory(S, name), o = document.createElement('option');
      o.value = c.id; o.textContent = c.name; el.insertBefore(o, el.querySelector('option[value="__new"]')); el.value = c.id; backupNow();
    } else el.value = (S.categories[0]||{}).id;
  }
  if($('#f-preview')) refreshLineForm();
}
function onBind(el, b){
  const [k, id, f] = b.split(':');
  const v = el.type === 'checkbox' ? el.checked : el.value;
  if(k === 'line'){ const l = S.lines.find(x => x.id === id); if(l){ l.active = v; touch(); } }
  else if(k === 'member'){
    const m = S.members.find(x => x.id === id); if(!m) return;
    if(f === 'name'){ const old = m.name; m.name = String(v).trim() || 'Sans nom'; const sl = salaryLine(S, id); if(sl && sl.name === `Salaire net – ${old}`) sl.name = `Salaire net – ${m.name}`; syncAllPockets(S); touch(false); }
    else if(f === 'type'){ m.type = v; m.contributes = v === 'adult'; syncAllPockets(S); touch(); }
    else if(f === 'age'){ const k = ensureKid(m); if(v === ''){ k.birth = null; } else { const mo = k.birth ? +k.birth.slice(5, 7) : undefined; kidSetAge(k, +v, undefined, mo); } touch(); }
    else if(f === 'birthMonth'){ const k = ensureKid(m), a = kidAge(k); if(a !== null){ kidSetAge(k, a, undefined, v === '' ? undefined : +v); touch(); } }
    else if(f === 'contributes'){ m.contributes = v; syncAllPockets(S); touch(); }
    else if(f === 'transferDay'){ m.transferDay = Math.min(Math.max(parseInt(v) || 1, 1), 31); touch(false); }
    else if(f === 'transferNext'){ m.transferNext = v === 'next'; touch(false); }
    else if(f === 'salary'){ setSalary(S, id, num(v)); touch(false); }
    else if(f === 'pocketAmount'){ m.pocket.amount = Math.abs(num(v)); syncPocket(S, id); touch(true); }
    else if(f === 'pocketPayer'){ m.pocket.payer = v; syncPocket(S, id); touch(true); }
    else if(f.startsWith('acc.')){ m.pocket.accounts = Object.assign({}, m.pocket.accounts || {}); m.pocket.accounts[f.slice(4)] = v || null; syncPocket(S, id); touch(false); }
    else if(f.startsWith('share.')){ m.pocket.shares = Object.assign({}, m.pocket.shares || {}); m.pocket.shares[f.slice(6)] = Math.max(0, num(v)); syncPocket(S, id); touch(false); }
  }
  else if(k === 'dist'){
    const d = S.settings.distribution;
    if(f === 'mode') d.mode = v; else if(f === 'includePersonal') d.includePersonal = v;
    touch();
  }
  else if(k === 'distc'){ S.settings.distribution.custom[id] = Math.max(0, num(v)); touch(false); }
  else if(k === 'set'){ if(f === 'backup' && !v) removeLocalCopy(S.id); S.settings[f] = f === 'commonAccountId' ? (v || null) : v; touch(f === 'currency' || f === 'commonAccountId' || f === 'provisionBlock' ? true : false); }
  else if(k === 'acc'){
    const a = accById(id); if(!a) return;
    a[f] = f === 'ownerId' ? (v || null) : String(v).trim(); touch(f === 'ownerId');
  }
  else if(k === 'cat'){ const c = S.categories.find(x => x.id === id); if(c){ c[f] = f === 'name' ? (String(v).trim() || 'Sans nom') : v; touch(false); } }
  else if(k === 'method'){ const m = S.settings.methods.find(x => x.id === id); if(m){ m.label = String(v).trim() || 'Sans nom'; touch(false); } }
  else if(k === 'prov'){
    const l = S.lines.find(x => x.id === id); if(!l) return;
    if(f === 'lastDate') l.lastDate = v || null;
    touch(false); patchProv(id);
  }
}
/* Bulle : pause au survol (souris), au focus et après un appui tactile */
(function(){
  const canHover = !!(window.matchMedia && matchMedia('(hover: hover)').matches);
  const inBox = e => e.target.closest && e.target.closest('.hero-pig');
  if(canHover){
    document.addEventListener('mouseover', e => { if(inBox(e)) U.bubbleHover = true; });
    document.addEventListener('mouseout', e => { if(inBox(e) && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.hero-pig'))) U.bubbleHover = false; });
  }
  document.addEventListener('focusin', e => { if(inBox(e)) U.bubbleFocus = true; });
  document.addEventListener('focusout', e => { if(inBox(e)) U.bubbleFocus = false; });
  document.addEventListener('pointerdown', e => { if(e.pointerType === 'touch' && inBox(e)) U.bubbleHold = Date.now() + 10000; });
  setInterval(bubbleTick, 3000);
})();
document.addEventListener('DOMContentLoaded', () => {
  const dlg = $('#dlg');
  dlg.addEventListener('click', e => { if(e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => {
    if(!U.tempCat) return;
    const id = U.tempCat; U.tempCat = null;
    if(S && !S.lines.some(l => l.catId === id)) S.categories = S.categories.filter(c => c.id !== id);
  });
  init();
});
window.addEventListener('beforeunload', e => { if(S && U.dirty && !U.fileHandle && !S.settings.backup){ e.preventDefault(); e.returnValue = ''; } });

</script>
